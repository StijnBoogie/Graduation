<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; font-family: 'Inter', -apple-system, system-ui, sans-serif; -webkit-font-smoothing: antialiased; background: #EFECE7; height: 100%; overscroll-behavior: none; }
  body { min-height: 100dvh; }
  #root { min-height: 100dvh; }
  @keyframes esPulse { 0%,100% { opacity: 1; transform: scale(1);} 50% { opacity: 0.4; transform: scale(1.4);} }
  @keyframes esDot { 0%   { opacity: 0; transform: translateX(-10px);}
                     30%  { opacity: 1; transform: translateX(0);}
                     70%  { opacity: 1; transform: translateX(0);}
                     100% { opacity: 0; transform: translateX(10px);} }
  @keyframes esBuzz { 0%,100% { transform: translateX(0);} 20% { transform: translateX(-1.5px);} 40% { transform: translateX(1.5px);} 60% { transform: translateX(-1px);} 80% { transform: translateX(1px);} }
  @keyframes esCardPulse { 0%,100% { box-shadow: 0 1px 2px rgba(0,0,0,0.04), 0 4px 14px rgba(0,0,0,0.04);} 50% { box-shadow: 0 1px 2px rgba(0,0,0,0.04), 0 6px 22px rgba(0,0,0,0.12);} }
  button { font-family: inherit; }
</style>
</head>
